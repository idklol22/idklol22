<!doctype html>
<meta charset="utf-8">
<title>card preview</title>
<style>
  body { margin: 0; padding: 32px; background: #0d1117; color: #8b949e; font: 13px ui-monospace, monospace; }
  body.light { background: #fff; color: #57606a; }
  nav { margin-bottom: 20px; display: flex; gap: 8px; }
  button { font: inherit; padding: 6px 12px; background: none; color: inherit; border: 1px solid #30363d; cursor: pointer; }
  button.on { border-color: currentColor; }
  /* same structure as README.md: inline images inside one paragraph, like github renders them */
  article { max-width: 1012px; font: 16px/1.5 -apple-system, "Segoe UI", sans-serif; }
</style>
<nav><button data-m="dark" class="on">dark</button><button data-m="light">light</button></nav>
<p>mimics github's readme column. run <code>python render.py --demo</code> first.</p>
<article><p><img data-c="banner-1" width="33%"><img data-c="banner-2" width="33%"><img data-c="banner-3" width="33%"><br>
<img data-c="hero" width="99%"><br>
<img data-c="contrib" width="99%">
</p></article>
<script>
  const draw = m => {
    const v = Date.now();
    document.querySelectorAll("img").forEach(i => i.src = `cards/${i.dataset.c}-${m}.svg?${v}`);
    document.body.className = m;
    document.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  };
  document.querySelectorAll("button").forEach(b => b.onclick = () => draw(b.dataset.m));
  draw(new URLSearchParams(location.search).get("m") || "dark");
</script>
